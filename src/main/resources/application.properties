spring.application.name=spring-boot-newsletter
server.port=8080

spring.datasource.url=jdbc:h2:mem:newsletterdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
# Clé pédagogique pour environnement local uniquement. En production, utiliser une variable d'environnement.
app.jwt.secret=dev-secret-key-for-newsletter-spring-boot-jwt-demo-please-change
